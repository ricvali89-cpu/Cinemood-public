# Public scheduler only: no Firebase, Notion or Emby credentials live here.
# The private Vercel endpoint verifies GitHub's signed OIDC token, repository,
# branch and exact workflow identity before running a synchronization.
name: CineMood personal sync

on:
  schedule:
    # Every 10 minutes, offset to avoid peak loads at the top of each hour.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinemood-personal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Trigger authenticated personal sync
        shell: bash
        env:
          SYNC_URL: https://cinemood-privato.vercel.app/api/personal-cron
        run: |
          set -euo pipefail
          # OIDC is short-lived and never printed to job logs or saved as an artifact.
          oidc_status="$(curl --silent --show-error --retry 2 --max-time 15 \
            -o "${RUNNER_TEMP}/cinemood-oidc.json" -w '%{http_code}' \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --get --data-urlencode "audience=${SYNC_URL}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          if [[ "${oidc_status}" != "200" ]]; then
            echo "::error::GitHub OIDC token request: HTTP ${oidc_status}"
            exit 1
          fi
          jwt="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' \
            < "${RUNNER_TEMP}/cinemood-oidc.json")"
          echo "::add-mask::${jwt}"
          worker_status="$(curl --silent --show-error --max-time 240 \
            -o "${RUNNER_TEMP}/cinemood-worker.json" -w '%{http_code}' \
            -H "Authorization: Bearer ${jwt}" \
            -H "Accept: application/json" \
            "${SYNC_URL}")"
          echo "CineMood worker: HTTP ${worker_status}"
          if [[ "${worker_status}" == "200" || "${worker_status}" == "207" ]]; then
            cat "${RUNNER_TEMP}/cinemood-worker.json"
            if [[ "${worker_status}" == "207" ]]; then
              echo "::warning::Some sync operations remain pending"
            fi
          else
            echo "::error::CineMood worker rejected: HTTP ${worker_status}"
            exit 1
          fi
